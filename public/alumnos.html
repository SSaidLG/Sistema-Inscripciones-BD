<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'azul-uni': '#002B5C', 'oro-uni': '#D59F0F' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-6 bg-azul-uni flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Directorio de Alumnos</h1>
            <a href="index.html" class="text-white hover:text-oro-uni font-semibold">← Volver al Inicio</a>
        </div>
        
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar por matrícula..." class="border border-gray-300 rounded-lg px-4 py-2 w-1/3 focus:ring-2 focus:ring-azul-uni focus:outline-none">
                <button class="bg-oro-uni text-white px-4 py-2 rounded-lg font-bold hover:bg-yellow-600 transition" onclick="abrirModal()">
                    + Nuevo Alumno
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-azul-uni uppercase text-sm">
                            <th class="p-3">Matrícula</th>
                            <th class="p-3">Nombre Completo</th>
                            <th class="p-3">Correo</th>
                            <th class="p-3">Promedio</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos" class="text-gray-700">
                        <tr><td colspan="5" class="text-center p-4">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalAlumno" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-lg w-1/3 p-6">
            <h2 id="modalTitulo" class="text-xl font-bold text-azul-uni mb-4">Nuevo Alumno</h2>
            <form id="formAlumno" class="space-y-4">
                <input type="hidden" id="modoEdicion" value="false">
                
                <div>
                    <label class="block text-sm font-semibold">Matrícula</label>
                    <input type="number" id="mat" class="w-full border rounded p-2" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold">Nombre</label>
                        <input type="text" id="nom" class="w-full border rounded p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">Apellido P.</label>
                        <input type="text" id="pat" class="w-full border rounded p-2" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold">Apellido M.</label>
                        <input type="text" id="matr" class="w-full border rounded p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">Promedio</label>
                        <input type="number" step="0.01" id="prom" class="w-full border rounded p-2" value="0">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold">Correo Electrónico</label>
                    <input type="email" id="corr" class="w-full border rounded p-2" required>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-azul-uni text-white rounded hover:bg-blue-900">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modalAlumno');
        const form = document.getElementById('formAlumno');

        // 1. READ
        async function cargarAlumnos() {
            try {
                const res = await fetch('/api/alumnos');
                const alumnos = await res.json();
                const tbody = document.getElementById('tabla-alumnos');
                tbody.innerHTML = ''; 

                alumnos.forEach(a => {
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50 alumno-row">
                            <td class="p-3 font-semibold text-azul-uni mat-cell">${a.matricula}</td>
                            <td class="p-3">${a.nombre_alumno} ${a.ap_paterno} ${a.ap_materno}</td>
                            <td class="p-3">${a.correo_alumno}</td>
                            <td class="p-3">${a.promedio}</td>
                            <td class="p-3 text-center">
                                <button onclick="editarAlumno(${a.matricula})" class="text-blue-500 hover:text-blue-700 mr-2"><i class="fa-solid fa-pen"></i> Editar</button>
                                <button onclick="borrarAlumno(${a.matricula})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i> Borrar</button>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                console.error("Error al cargar:", error);
                document.getElementById('tabla-alumnos').innerHTML = '<tr><td colspan="5" class="text-center text-red-500 p-4">Error de conexión con la base de datos</td></tr>';
            }
        }

        // 2. CREATE / UPDATE
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const matricula = document.getElementById('mat').value;
            const datos = {
                matricula: matricula,
                nombre_alumno: document.getElementById('nom').value,
                ap_paterno: document.getElementById('pat').value,
                ap_materno: document.getElementById('matr').value,
                correo_alumno: document.getElementById('corr').value,
                promedio: document.getElementById('prom').value
            };

            const modoEdicion = document.getElementById('modoEdicion').value === "true";
            const url = modoEdicion ? `/api/alumnos/${matricula}` : '/api/alumnos';
            const metodo = modoEdicion ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                if(res.ok) {
                    cerrarModal();
                    cargarAlumnos();
                } else {
                    const error = await res.json();
                    alert("Error: " + error.mensaje);
                }
            } catch (error) {
                alert("Hubo un error al procesar la solicitud.");
            }
        });

        // 3. PREPARAR EDICIÓN
        async function editarAlumno(id) {
            const res = await fetch(`/api/alumnos/${id}`);
            const a = await res.json();
            
            document.getElementById('mat').value = a.matricula;
            document.getElementById('mat').readOnly = true;
            document.getElementById('nom').value = a.nombre_alumno;
            document.getElementById('pat').value = a.ap_paterno;
            document.getElementById('matr').value = a.ap_materno;
            document.getElementById('corr').value = a.correo_alumno;
            document.getElementById('prom').value = a.promedio;
            
            document.getElementById('modoEdicion').value = "true";
            document.getElementById('modalTitulo').innerText = "Editar Alumno";
            modal.classList.remove('hidden');
        }

        // 4. DELETE
        async function borrarAlumno(id) {
            if(confirm('¿Estás seguro de eliminar este registro?')) {
                const res = await fetch(`/api/alumnos/${id}`, { method: 'DELETE' });
                if(res.ok) cargarAlumnos();
                else {
                    const error = await res.json();
                    alert("Error: " + error.mensaje);
                }
            }
        }

        // CONTROLADORES DE INTERFAZ
        function abrirModal() {
            form.reset();
            document.getElementById('mat').readOnly = false;
            document.getElementById('modoEdicion').value = "false";
            document.getElementById('modalTitulo').innerText = "Nuevo Alumno";
            modal.classList.remove('hidden');
        }

        function cerrarModal() {
            modal.classList.add('hidden');
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const filas = document.querySelectorAll('.alumno-row');
            filas.forEach(fila => {
                const mat = fila.querySelector('.mat-cell').innerText.toLowerCase();
                fila.style.display = mat.includes(query) ? '' : 'none';
            });
        }

        window.addEventListener('DOMContentLoaded', cargarAlumnos);
    </script>
</body>
</html>
