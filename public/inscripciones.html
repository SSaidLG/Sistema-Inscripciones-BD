<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscripción de Materias</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'azul-uni': '#002B5C',
                        'oro-uni': '#D59F0F'
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-7xl mx-auto">

        <!-- HEADER -->

        <div class="bg-azul-uni text-white rounded-xl p-6 shadow-lg mb-8">

            <div class="flex justify-between items-center">

                <div>
                    <h1 class="text-3xl font-bold">
                        Inscripción de Materias
                    </h1>

                    <p class="text-gray-200 mt-2">
                        Gestión de carga académica
                    </p>
                </div>

                <a href="./login/accesoAdmin.html"
                class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition">

                    <i class="fa-solid fa-house mr-2"></i>
                    Inicio

                </a>

            </div>

        </div>

        <!-- BUSQUEDA -->

        <div class="bg-white rounded-xl shadow-md p-6 mb-6">

            <div class="flex gap-4">

                <input
                    type="number"
                    id="matricula"
                    placeholder="Ingresa matrícula"
                    class="flex-1 border rounded-lg px-4 py-3">

                <button
                    onclick="buscarAlumno()"
                    class="bg-azul-uni text-white px-6 rounded-lg hover:bg-blue-900">

                    Buscar

                </button>

            </div>

        </div>

        <!-- INFORMACION ALUMNO -->

        <div
            id="cardAlumno"
            class="hidden bg-white rounded-xl shadow-md p-6 mb-6">

            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">

                <div>
                    <p class="text-gray-500 text-sm">Matrícula</p>
                    <p id="infoMatricula" class="font-bold"></p>
                </div>

                <div>
                    <p class="text-gray-500 text-sm">Alumno</p>
                    <p id="infoNombre" class="font-bold"></p>
                </div>

                <div>
                    <p class="text-gray-500 text-sm">Carrera</p>
                    <p id="infoCarrera" class="font-bold"></p>
                </div>

                <div>
                    <p class="text-gray-500 text-sm">Promedio</p>
                    <p id="infoPromedio" class="font-bold"></p>
                </div>

                <div>
                    <p class="text-gray-500 text-sm">Estado</p>
                    <p id="infoEstado" class="font-bold"></p>
                </div>

            </div>

        </div>

        <!-- TABLAS -->

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- HORARIOS DISPONIBLES -->

            <div class="bg-white rounded-xl shadow-md p-6">

                <h2 class="text-xl font-bold text-azul-uni mb-4">
                    Horarios Disponibles
                </h2>

                    <div class="flex gap-4 mb-4">

        <select id="filtroSemestre" class="border p-2 rounded">
            <option value="">Todos los semestres</option>

            <option value="1">1°</option>
            <option value="2">2°</option>
            <option value="3">3°</option>
            <option value="4">4°</option>
            <option value="5">5°</option>
            <option value="6">6°</option>
            <option value="7">7°</option>
            <option value="8">8°</option>
            <option value="9">9°</option>
        </select>

        <select id="filtroTurno" class="border p-2 rounded">
            <option value="">Todos los turnos</option>
            <option value="M">Matutino</option>
            <option value="V">Vespertino</option>
        </select>

    </div>

                <div class="overflow-auto max-h-[600px]">

                    <table class="w-full text-sm">

                        <thead class="bg-gray-100 sticky top-0">

                            <tr>

                                <th class="p-2 text-left">Materia</th>
                                <th class="p-2 text-left">Grupo</th>
                                <th class="p-2 text-left">Profesor</th>
                                <th class="p-2 text-left">Cupos</th>
                                <th class="p-2 text-center">Acción</th>

                            </tr>

                        </thead>

                        <tbody id="tablaHorarios"></tbody>

                    </table>

                </div>

            </div>

            <!-- HORARIO SELECCIONADO -->

            <div class="bg-white rounded-xl shadow-md p-6">

                <div class="flex justify-between items-center mb-4">

                    <h2 class="text-xl font-bold text-azul-uni">
                        Horario Seleccionado
                    </h2>

                    <span
                        id="contadorMaterias"
                        class="bg-oro-uni text-white px-3 py-1 rounded-full text-sm">

                        0 / 7

                    </span>

                </div>

                <div class="overflow-auto max-h-[600px]">

                    <table class="w-full text-sm">

                        <thead class="bg-gray-100 sticky top-0">

                            <tr>

                                <th class="p-2 text-left">Materia</th>
                                <th class="p-2 text-left">Grupo</th>
                                <th class="p-2 text-left">Horario</th>
                                <th class="p-2 text-center">Acción</th>

                            </tr>

                        </thead>

                        <tbody id="tablaSeleccionadas"></tbody>

                    </table>

                </div>
                    <div class="flex justify-end mt-4">

                        <button
                            id="btnConfirmar"
                            onclick="procesarInscripcion()"
                            class="hidden bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold shadow-md">

                            Confirmar Inscripción

                        </button>

                    </div>
                    <div class="mt-auto flex justify-end border-t pt-4">
                        <button id="btnComprobante" onclick="generarComprobantePDF()" class="bg-gray-600 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded shadow mt-4 transition duration-300">
                            <i class="fa-solid fa-file-pdf mr-2"></i> Generar Comprobante PDF
                        </button>
                    </div>
            </div>
        </div>

    </div>


<script>

let materiasSeleccionadas = [];
let alumnoActual = null;

// =========================================
// BUSCAR ALUMNO
// =========================================

async function buscarAlumno(){

    const matricula = document.getElementById('matricula').value;

    if(!matricula){
        alert('Ingresa una matrícula');
        return;
    }

    try{

        const res = await fetch(
            `/api/inscripciones/alumno/${matricula}`
        );

        if(!res.ok){
            throw new Error('Alumno no encontrado');
        }

        // 2. CORREGIDO: Usamos 'res.json()' en lugar de 'respuesta.json()'
        alumnoActual = await res.json();

        document.getElementById('cardAlumno')
        .classList.remove('hidden');

        document.getElementById('infoMatricula')
        .innerText = alumnoActual.matricula;

        document.getElementById('infoNombre')
        .innerText =
            `${alumnoActual.nombre_alumno}
            ${alumnoActual.ap_paterno}
            ${alumnoActual.ap_materno}`;

        document.getElementById('infoCarrera')
        .innerText = alumnoActual.nombre_carrera;

        document.getElementById('infoPromedio')
        .innerText = Number(alumnoActual.promedio).toFixed(1);

        const activo = alumnoActual.estado == 1;
        document.getElementById('infoEstado').innerHTML = `
            <span class="${activo
                ? 'text-green-600 font-semibold'
                : 'text-red-600 font-semibold'}">
                ${activo ? 'Activo' : 'Inactivo'}
            </span>
        `;
        

    }catch(error){

        alert(error.message);

    }

}

// =========================================
// CARGAR HORARIOS
// =========================================

document.getElementById('filtroSemestre')
    .addEventListener('change', cargarHorarios);

document.getElementById('filtroTurno')
    .addEventListener('change', cargarHorarios);


//Obtener Horarios
async function cargarHorarios(){

    try{

        const res = await fetch('/api/inscripciones/horarios');

        const horarios = await res.json();

        // Obtener filtros
        const semestre =
            document.getElementById('filtroSemestre').value;

        const turno =
            document.getElementById('filtroTurno').value;

        // Filtrar
        const horariosFiltrados = horarios.filter(h => {

            // Ejemplo: "3M"
            const valor = h.semestre_turno;

            const semestreHorario = valor.slice(0, -1);
            const turnoHorario = valor.slice(-1);

            const coincideSemestre =
                semestre === '' || semestreHorario === semestre;

            const coincideTurno =
                turno === '' || turnoHorario === turno;

            return coincideSemestre && coincideTurno;

        });

        const tbody =
            document.getElementById('tablaHorarios');

        tbody.innerHTML = '';

        horariosFiltrados.forEach(h => {

            tbody.innerHTML += `

                <tr class="border-b">

                    <td class="p-2">
                        ${h.nombre_materia}
                    </td>

                    <td class="p-2">
                        ${h.grupo}
                    </td>

                    <td class="p-2">
                        ${h.nombre_profesor}
                        ${h.ap_paterno_profesor}
                    </td>

                    <td class="p-2">
                        ${h.cupos_disponibles}
                    </td>

                    <td class="p-2 text-center">

                        <button
                            onclick='agregarMateria(${JSON.stringify(h)})'
                            class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded">

                            Agregar

                        </button>

                    </td>

                </tr>

            `;

        });

    }catch(error){

        console.error(error);

    }

}
// =========================================
// AGREGAR MATERIA
// =========================================

function agregarMateria(horario) {

    if (materiasSeleccionadas.length >= 7) {
        alert("Límite alcanzado: Máximo 7 materias permitidas.");
        return;
    }

    if (horario.cupos_disponibles <= 0) {
        alert("Cupo agotado para este grupo.");
        return;
    }

    const materiaYaInscrita =
        materiasSeleccionadas.some(
            m => m.id_materia === horario.id_materia
        );

    if (materiaYaInscrita) {
        alert(`Ya tienes la materia "${horario.nombre_materia}" seleccionada.`);
        return;
    }

    if (hayChoqueHorario(horario)) {
        alert("¡Choque de horario detectado!");
        return;
    }

    materiasSeleccionadas.push(horario);

    renderSeleccionadas();
}
// Función auxiliar para detectar choques
function hayChoqueHorario(nuevoHorario) {
    const dias = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
    
    for (const inscrito of materiasSeleccionadas) {
        for (const dia of dias) {
            if (nuevoHorario[dia] && inscrito[dia]) {
                // Parsear horas (ej. "07:00-09:00")
                const [nuevoInicio, nuevoFin] = nuevoHorario[dia].split('-');
                const [inscritoInicio, inscritoFin] = inscrito[dia].split('-');
                
                // Lógica de traslape de rangos
                if (nuevoInicio < inscritoFin && nuevoFin > inscritoInicio) {
                    return true; // Hay choque
                }
            }
        }
    }
    return false;
}

// =========================================
// RENDER TABLA DERECHA
// =========================================

function renderSeleccionadas(){

    const tbody =
    document.getElementById('tablaSeleccionadas');

    tbody.innerHTML = '';

    materiasSeleccionadas.forEach(h => {

        const horarioTexto = [

            h.lunes ? `Lun ${h.lunes}` : '',
            h.martes ? `Mar ${h.martes}` : '',
            h.miercoles ? `Mie ${h.miercoles}` : '',
            h.jueves ? `Jue ${h.jueves}` : '',
            h.viernes ? `Vie ${h.viernes}` : '',
            h.sabado ? `Sab ${h.sabado}` : ''

        ]
        .filter(Boolean)
        .join(' | ');

        const btn =
            document.getElementById('btnConfirmar');

        if(materiasSeleccionadas.length > 0){

            btn.classList.remove('hidden');

        }else{

            btn.classList.add('hidden');

        }
        tbody.innerHTML += `

            <tr class="border-b">

                <td class="p-2">
                    ${h.nombre_materia}
                </td>

                <td class="p-2">
                    ${h.grupo}
                </td>

                <td class="p-2 text-xs">
                    ${horarioTexto}
                </td>

                <td class="p-2 text-center">

                    <button
                        onclick="eliminarMateria(${h.id_horario})"
                        class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded">

                        X

                    </button>

                </td>

            </tr>

        `;

    });

    document.getElementById('contadorMaterias')
    .innerText =
    `${materiasSeleccionadas.length} / 7`;

}

// =========================================
// ELIMINAR
// =========================================

function eliminarMateria(id){

    materiasSeleccionadas =
    materiasSeleccionadas.filter(
        m => m.id_horario !== id
    );

    renderSeleccionadas();

}

async function procesarInscripcion() {
    if(materiasSeleccionadas.length === 0) {
        alert("Debes seleccionar al menos una materia.");
        return;
    }

    const confirmacion = confirm(`¿Estás seguro de inscribir estas ${materiasSeleccionadas.length} asignaturas?`);
    if(!confirmacion) return;

    // Extraer solo los IDs para el backend
    const idsHorarios = materiasSeleccionadas.map(m => m.id_horario);
    const btn = document.getElementById('btnConfirmar');
    btn.disabled = true;
    btn.innerText = "Procesando...";

    try {
        const respuesta = await fetch('/api/inscripciones/confirmar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                matricula: alumnoActual.matricula, // Asegúrate de tener guardado el alumno en esta variable global cuando lo buscas
                horarios: idsHorarios
            })
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
            alert("¡Inscripción exitosa! Ya puedes generar el comprobante.");
            // 1. Limpiamos la lista temporal
            materiasSeleccionadas = [];
            renderSeleccionadas();
            
            // 2. Mostramos el botón de generar PDF
            document.getElementById('btnComprobante').classList.remove('hidden');
            
            // 3. Volvemos a buscar los horarios para que los cupos se actualicen visualmente
            buscarHorarios();
        } else {
            alert("Error: " + data.mensaje);
        }
    } catch (error) {
        console.error(error);
        alert("Error de conexión al servidor.");
    } finally {
        btn.disabled = false;
        btn.innerText = "Confirmar Inscripción";
    }
}

async function generarComprobantePDF() {
    if (!alumnoActual) {
        alert("Primero debes buscar un alumno.");
        return;
    }

    try {
        const res = await fetch(`/api/inscripciones/comprobante/${alumnoActual.matricula}`);
        const materias = await res.json();

        if (materias.length === 0) {
            alert("Este alumno no tiene materias inscritas.");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Paleta de colores institucionales
        const azulUNAM = [0, 43, 92];
        const oroUNAM = [213, 159, 15];

        // --- 1. ENCABEZADO AZUL ---
        doc.setFillColor(...azulUNAM);
        doc.rect(0, 0, 210, 35, 'F'); // Bloque azul superior
        
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(15);
        doc.text("UNIVERSIDAD NACIONAL AUTÓNOMA DE MÉXICO", 105, 14, { align: 'center' });
        
        doc.setFontSize(12);
        doc.text("Facultad de Estudios Superiores Aragón", 105, 21, { align: 'center' });
        
        doc.setFont("helvetica", "normal");
        doc.text("Comprobante Oficial de Inscripción", 105, 28, { align: 'center' });

        // --- 2. INSERCIÓN DE LOGOS ---
        // Tomamos las imágenes ocultas del HTML
        const imgUnam = document.getElementById('logoUnam');
        const imgFes = document.getElementById('logoFes');
        
        // Verificamos que las imágenes hayan cargado bien en el navegador antes de pintarlas
        if (imgUnam.complete && imgUnam.naturalWidth > 0) {
            doc.addImage(imgUnam, 'PNG', 12, 3, 24, 28);
        }
        if (imgFes.complete && imgFes.naturalWidth > 0) {
            doc.addImage(imgFes, 'PNG', 174, 3, 24, 28);
        }

        // --- 3. CAJA DE DATOS DEL ALUMNO ---
        doc.setTextColor(0, 0, 0); 
        doc.setDrawColor(...oroUNAM);
        doc.setLineWidth(0.5);
        doc.roundedRect(12, 42, 186, 25, 2, 2, 'S'); // Caja con borde dorado

        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text(`Matrícula:`, 16, 49);
        doc.setFont("helvetica", "normal");
        doc.text(`${alumnoActual.matricula}`, 42, 49);

        doc.setFont("helvetica", "bold");
        doc.text(`Nombre:`, 16, 56);
        doc.setFont("helvetica", "normal");
        doc.text(`${alumnoActual.nombre_alumno} ${alumnoActual.ap_paterno} ${alumnoActual.ap_materno}`, 42, 56);

        doc.setFont("helvetica", "bold");
        doc.text(`Carrera:`, 16, 63);
        doc.setFont("helvetica", "normal");
        doc.text(`${alumnoActual.nombre_carrera}`, 42, 63);

        const periodo = materias[0].periodo_escolar;
        const fechaInscripcion = materias[0].fecha;

        doc.setFont("helvetica", "bold");
        doc.text(`Promedio:`, 125, 49);
        doc.setFont("helvetica", "normal");
        doc.text(`${Number(alumnoActual.promedio).toFixed(1)}`, 148, 49);

        doc.setFont("helvetica", "bold");
        doc.text(`Periodo:`, 125, 56);
        doc.setFont("helvetica", "normal");
        doc.text(`${periodo}`, 148, 56);

        doc.setFont("helvetica", "bold");
        doc.text(`Fecha:`, 125, 63);
        doc.setFont("helvetica", "normal");
        doc.text(`${fechaInscripcion}`, 148, 63);

        // --- 4. TABLA DE ASIGNATURAS ---
        let totalCreditos = 0;
        const filasTabla = materias.map((m, i) => {
            totalCreditos += m.creditos;
            return [i + 1, m.nombre_materia, m.grupo, m.profesor, m.creditos];
        });

        doc.autoTable({
            startY: 75,
            head: [['#', 'Asignatura', 'Grupo', 'Profesor', 'Créditos']],
            body: filasTabla,
            theme: 'grid',
            headStyles: { fillColor: azulUNAM, textColor: 255, halign: 'center' },
            columnStyles: {
                0: { halign: 'center', cellWidth: 10 },
                2: { halign: 'center', cellWidth: 20 },
                4: { halign: 'center', cellWidth: 22 } 
            },
            styles: { fontSize: 9, cellPadding: 3 },
            alternateRowStyles: { fillColor: [240, 245, 250] }, 
            margin: { left: 12, right: 12 }
        });

        // --- 5. BLOQUE DE CRÉDITOS Y FIRMA ---
        const finalY = doc.lastAutoTable.finalY + 8;
        
        // Cuadro dorado para el total de créditos
        doc.setFillColor(...oroUNAM);
        doc.rect(138, finalY, 60, 8, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.text(`Total de Créditos: ${totalCreditos}`, 168, finalY + 5.5, { align: 'center' });

        // Línea de firma
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(9);
        doc.text("_______________________________________", 105, finalY + 40, { align: 'center' });
        doc.text("Firma del Alumno", 105, finalY + 45, { align: 'center' });

        // --- 6. GUARDAR PDF ---
        doc.save(`Comprobante_Inscripcion_${alumnoActual.matricula}.pdf`);

    } catch (error) {
        console.error(error);
        alert("Ocurrió un error al generar el comprobante.");
    }
}


window.addEventListener(
    'DOMContentLoaded',
    cargarHorarios
);

</script>

<img id="logoUnam" src="img/unam.png" class="hidden" alt="UNAM">
    <img id="logoFes" src="img/fes.png" class="hidden" alt="FES">
</body>
</html>
