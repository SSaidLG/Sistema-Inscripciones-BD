<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Profesores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'azul-uni': '#002B5C', 'oro-uni': '#D59F0F' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-fondo-claro text-gray-800 font-sans min-h-screen flex flex-col"></body>

<nav class="bg-azul-uni text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">

            <!-- Logo + Título -->
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-oro-uni text-2xl"></i>
                </div>

                <div>
                    <h1 class="font-bold text-xl tracking-wide">
                        Gestión Académica ICO
                    </h1>
                    <p class="text-xs text-gray-300">
                        Sistema de administración escolar
                    </p>
                </div>
            </div>

            <!-- Botón Inicio -->
            <a href="../login/accesoAdmin.html"
               class="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition px-4 py-2 rounded-lg font-semibold">
                
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>

        </div>
    </div>
</nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">


    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-6 bg-azul-uni flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Directorio de Profesores</h1>
            
                        <!-- Botón regresar -->
            <div class="mt-4 md:mt-0">
                <button 
                    onclick="history.back()"
                    class="flex items-center gap-2 bg-azul-uni hover:bg-blue-900 text-white px-5 py-3 rounded-xl shadow-md transition-all duration-300 hover:scale-105"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Regresar</span>
                </button>
            </div>
        </div>
        
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar por id..." class="border border-gray-300 rounded-lg px-4 py-2 w-1/3 focus:ring-2 focus:ring-azul-uni focus:outline-none">
                <button class="bg-oro-uni text-white px-4 py-2 rounded-lg font-bold hover:bg-yellow-600 transition" onclick="abrirModal()">
                    + Nuevo Profesor
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-azul-uni uppercase text-sm">
                            <th class="p-3">id_profesor</th>
                            <th class="p-3">Nombre Completo</th>
                            <th class="p-3">Correo</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-profesores" class="text-gray-700">
                        <tr><td colspan="5" class="text-center p-4">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalProfesor" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-lg w-1/3 p-6">
            <h2 id="modalTitulo" class="text-xl font-bold text-azul-uni mb-4">Nuevo Profesor</h2>
            <form id="formProfesor" class="space-y-4">
                <input type="hidden" id="modoEdicion" value="false">
                <input type="hidden" id="id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold">Nombre</label>
                        <input type="text" id="nom" class="w-full border rounded p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">Apellido P.</label>
                        <input type="text" id="pat" class="w-full border rounded p-2" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold">Apellido M.</label>
                        <input type="text" id="matr" class="w-full border rounded p-2" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold">Correo Electrónico</label>
                    <input type="email" id="corr" class="w-full border rounded p-2" required>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-azul-uni text-white rounded hover:bg-blue-900">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modalProfesor');
        const form = document.getElementById('formProfesor');

        // 1. READ
        async function cargarProfesores() {
            try {
                const res = await fetch('/api/profesores');
                const profesores = await res.json();
                const tbody = document.getElementById('tabla-profesores');
                tbody.innerHTML = ''; 

                profesores.forEach(a => {
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50 profesor-row">
                            <td class="p-3 font-semibold text-azul-uni mat-cell">${a.id_profesor}</td>
                            <td class="p-3">${a.nombre_profesor} ${a.ap_paterno_profesor} ${a.ap_materno_profesor}</td>
                            <td class="p-3">${a.correo_profesor}</td>
                            <td class="p-3 text-center">
                                <button onclick="editarProfesor(${a.id_profesor})" class="text-blue-500 hover:text-blue-700 mr-2"><i class="fa-solid fa-pen"></i> Editar</button>
                                <button onclick="borrarProfesor(${a.id_profesor})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i> Borrar</button>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                console.error("Error al cargar:", error);
                document.getElementById('tabla-profesores').innerHTML = '<tr><td colspan="5" class="text-center text-red-500 p-4">Error de conexión con la base de datos</td></tr>';
            }
        }

        // 2. CREATE / UPDATE
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id_profesor = document.getElementById('id').value;
            const datos = {
                nombre_profesor: document.getElementById('nom').value,
                ap_paterno_profesor: document.getElementById('pat').value,
                ap_materno_profesor: document.getElementById('matr').value,
                correo_profesor: document.getElementById('corr').value,
            };

            const modoEdicion = document.getElementById('modoEdicion').value === "true";
            const url = modoEdicion ? `/api/profesores/${id_profesor}` : '/api/profesores';
            const metodo = modoEdicion ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                if(res.ok) {
                    cerrarModal();
                    cargarProfesores();
                } else {
                    const error = await res.json();
                    alert("Error: " + error.mensaje);
                }
            } catch (error) {
                alert("Hubo un error al procesar la solicitud.");
            }
        });

        // 3. PREPARAR EDICIÓN
        async function editarProfesor(id) {
            const res = await fetch(`/api/profesores/${id}`);
            const a = await res.json();
            
            document.getElementById('id').value = a.id_profesor;
            document.getElementById('id').readOnly = true;
            document.getElementById('nom').value = a.nombre_profesor;
            document.getElementById('pat').value = a.ap_paterno_profesor;
            document.getElementById('matr').value = a.ap_materno_profesor;
            document.getElementById('corr').value = a.correo_profesor;
            
            document.getElementById('modoEdicion').value = "true";
            document.getElementById('modalTitulo').innerText = "Editar Profesor";
            modal.classList.remove('hidden');
        }

        // 4. DELETE
        async function borrarProfesor(id) {
            if(confirm('¿Estás seguro de eliminar este registro?')) {
                const res = await fetch(`/api/profesores/${id}`, { method: 'DELETE' });
                if(res.ok) cargarProfesores();
                else {
                    const error = await res.json();
                    alert("Error: " + error.mensaje);
                }
            }
        }

        // CONTROLADORES DE INTERFAZ
        function abrirModal() {
            form.reset();
            document.getElementById('id').readOnly = false;
            document.getElementById('modoEdicion').value = "false";
            document.getElementById('modalTitulo').innerText = "Nuevo Profesor";
            modal.classList.remove('hidden');
        }

        function cerrarModal() {
            modal.classList.add('hidden');
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const filas = document.querySelectorAll('.profesor-row');
            filas.forEach(fila => {
                const mat = fila.querySelector('.mat-cell').innerText.toLowerCase();
                fila.style.display = mat.includes(query) ? '' : 'none';
            });
        }

        window.addEventListener('DOMContentLoaded', cargarProfesores);
    </script>

    </main>
</body>
</html>
