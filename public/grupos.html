<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Grupos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'azul-uni': '#002B5C', 'oro-uni': '#D59F0F' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-fondo-claro text-gray-800 font-sans min-h-screen flex flex-col"></body>

<nav class="bg-azul-uni text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">

            <!-- Logo + Título -->
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-oro-uni text-2xl"></i>
                </div>

                <div>
                    <h1 class="font-bold text-xl tracking-wide">
                        Gestión Académica ICO
                    </h1>
                    <p class="text-xs text-gray-300">
                        Sistema de administración escolar
                    </p>
                </div>
            </div>

            <!-- Botón Inicio -->
            <a href="../login/accesoAdmin.html"
               class="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition px-4 py-2 rounded-lg font-semibold">
                
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>

        </div>
    </div>
</nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">


    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-6 bg-azul-uni flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Directorio de Grupos</h1>
            
                        <!-- Botón regresar -->
            <div class="mt-4 md:mt-0">
                <button 
                    onclick="history.back()"
                    class="flex items-center gap-2 bg-azul-uni hover:bg-blue-900 text-white px-5 py-3 rounded-xl shadow-md transition-all duration-300 hover:scale-105"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Regresar</span>
                </button>
            </div>
        </div>
        
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar por nombre..." class="border border-gray-300 rounded-lg px-4 py-2 w-1/3 focus:ring-2 focus:ring-azul-uni focus:outline-none">
                <button class="bg-oro-uni text-white px-4 py-2 rounded-lg font-bold hover:bg-yellow-600 transition" onclick="abrirModal()">
                    + Nuevo Grupo
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-azul-uni uppercase text-sm">
                            <th class="p-3">ID</th>
                            <th class="p-3">Grupo</th>
                            <th class="p-3">Turno</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-grupos" class="text-gray-700">
                        <tr><td colspan="5" class="text-center p-4">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalGrupo" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-lg w-1/3 p-6">
            <h2 id="modalTitulo" class="text-xl font-bold text-azul-uni mb-4">Nuevo Grupo</h2>
            <form id="formGrupo" class="space-y-4">
                <input type="hidden" id="modoEdicion" value="false">
                <input type="hidden" id="id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold">
                            Grupo
                        </label>
                        <input
                            type="number"
                            id="grupo"
                            class="w-full border rounded p-2"
                            required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">
                            Turno
                        </label>
                        <select
                            id="turno"
                            class="w-full border rounded p-2">
                            <option value="Matutino">
                                Matutino
                            </option>
                            <option value="Vespertino">
                                Vespertino
                            </option>
                            <option value="Mixto">
                                Mixto
                            </option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-azul-uni text-white rounded hover:bg-blue-900">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modalGrupo');
        const form = document.getElementById('formGrupo');

        // 1. READ
        async function cargarGrupos() {
            try {
                const res = await fetch('/api/grupos');
                const grupos = await res.json();
                const tbody = document.getElementById('tabla-grupos');
                tbody.innerHTML = '';
                grupos.forEach(g => {
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50 grupo-row">
                            <td class="p-3">
                                ${g.id_grupo}
                            </td>
                            <td class="p-3">
                                ${g.grupo}
                            </td>
                            <td class="p-3">
                                ${g.turno}
                            </td>
                            <td class="p-3 text-center">
                                <button
                                    onclick="editarGrupo(${g.id_grupo})"
                                    class="text-blue-500 hover:text-blue-700 mr-2">
                                    <i class="fa-solid fa-pen"></i>
                                    Editar
                                </button>
                                <button
                                    onclick="borrarGrupo(${g.id_grupo})"
                                    class="text-red-500 hover:text-red-700">
                                    <i class="fa-solid fa-trash"></i>
                                    Borrar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                document.getElementById('tabla-grupos').innerHTML = '<tr><td colspan="4" class="text-center text-red-500 p-4">Error al cargar grupos</td></tr>';
            }
        }

        // 2. CREATE / UPDATE
        form.addEventListener('submit', async (e) => {

            e.preventDefault();
            const id = document.getElementById('id').value;
            const datos = {
                grupo: document.getElementById('grupo').value,
                turno: document.getElementById('turno').value
            };
            const modoEdicion = document.getElementById('modoEdicion').value === "true";
            const url = modoEdicion ? `/api/grupos/${id}` : '/api/grupos';
            const metodo = modoEdicion ? 'PUT' : 'POST';
            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });
                if(res.ok) {
                    cerrarModal();
                    cargarGrupos();
                } else {
                    const error = await res.json();
                    alert(error.mensaje);
                }
            } catch (error) {
                alert('Error al guardar');
            }
        });

        // 3. PREPARAR EDICIÓN
        async function editarGrupo(id) {

            const res = await fetch(`/api/grupos/${id}`);
            const g = await res.json();
            document.getElementById('id').value = g.id_grupo;
            document.getElementById('grupo').value = g.grupo;
            document.getElementById('turno').value = g.turno;
            document.getElementById('modoEdicion').value = "true";
            document.getElementById('modalTitulo').innerText = "Editar Grupo"; 
                modal.classList.remove('hidden');
        }

        // 4. DELETE
        async function borrarGrupo(id) {
            
            if(confirm('¿Eliminar grupo?')) {
                const res = await fetch( `/api/grupos/${id}`,
                    {
                        method: 'DELETE'
                    }
                );
                if(res.ok) {
                    cargarGrupos();
                } else {
                    const error = await res.json();
                    alert(error.mensaje);
                }
            }
        }

        // CONTROLADORES DE INTERFAZ
        function abrirModal() {
            form.reset();
            document.getElementById('id').readOnly = false;
            document.getElementById('modoEdicion').value = "false";
            document.getElementById('modalTitulo').innerText = "Nuevo Grupo";
            modal.classList.remove('hidden');
        }

        function cerrarModal() {
            modal.classList.add('hidden');
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const filas = document.querySelectorAll('.grupo-row');
            filas.forEach(fila => {
                const mat = fila.querySelector('.mat-cell').innerText.toLowerCase();
                fila.style.display = mat.includes(query) ? '' : 'none';
            });
        }

        window.addEventListener('DOMContentLoaded', cargarGrupos);
    </script>

    </main>
</body>
</html>
