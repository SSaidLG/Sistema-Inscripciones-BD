<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Horarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'azul-uni': '#002B5C', 'oro-uni': '#D59F0F' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-fondo-claro text-gray-800 font-sans min-h-screen flex flex-col"></body>

<nav class="bg-azul-uni text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">

            <!-- Logo + Título -->
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-lg">
                    <i class="fa-solid fa-graduation-cap text-oro-uni text-2xl"></i>
                </div>

                <div>
                    <h1 class="font-bold text-xl tracking-wide">
                        Gestión Académica ICO
                    </h1>
                    <p class="text-xs text-gray-300">
                        Sistema de administración escolar
                    </p>
                </div>
            </div>

            <!-- Botón Inicio -->
            <a href="../login/accesoAdmin.html"
               class="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition px-4 py-2 rounded-lg font-semibold">
                
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>

        </div>
    </div>
</nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">


    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-6 bg-azul-uni flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Directorio de Horarios</h1>
            
                        <!-- Botón regresar -->
            <div class="mt-4 md:mt-0">
                <button 
                    onclick="history.back()"
                    class="flex items-center gap-2 bg-azul-uni hover:bg-blue-900 text-white px-5 py-3 rounded-xl shadow-md transition-all duration-300 hover:scale-105"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Regresar</span>
                </button>
            </div>
        </div>
        
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar por nombre..." class="border border-gray-300 rounded-lg px-4 py-2 w-1/3 focus:ring-2 focus:ring-azul-uni focus:outline-none">
                <button class="bg-oro-uni text-white px-4 py-2 rounded-lg font-bold hover:bg-yellow-600 transition" onclick="abrirModal()">
                    + Nuevo Horario
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-azul-uni uppercase text-sm">
                            <th class="p-3">ID</th>
                            <th class="p-3">Materia</th>
                            <th class="p-3">Profesor</th>
                            <th class="p-3">Grupo</th>
                            <th class="p-3">Semestre</th>
                            <th class="p-3">Salón</th>
                            <th class="p-3">Horario</th>
                            <th class="p-3">Cupos</th>

                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-horarios" class="text-gray-700">
                        <tr>
                            <td colspan="9" class="text-center p-4">
                                Cargando datos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalHorario" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white rounded-xl shadow-lg w-1/3 p-6">
            <h2 id="modalTitulo" class="text-xl font-bold text-azul-uni mb-4">Nuevo Horario</h2>
            <form id="formHorario" class="space-y-4">
                <input type="hidden" id="modoEdicion" value="false">
                <input type="hidden" id="id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label>Semestre / Turno</label>
                        <input type="text" id="semestre_turno" class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label>Materia</label>
                        <input type="number" id="cve_materia" class="w-full border rounded p-2">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label>Profesor</label>
                        <input type="number" id="id_profesor" class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label>Grupo</label>
                        <input type="number" id="id_grupo" class="w-full border rounded p-2">
                    </div>
                </div>
                <div>
                    <label>Nombre Materia</label>
                    <input type="text" id="materia" class="w-full border rounded p-2">
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <input type="text" id="lunes" placeholder="Lunes">
                    <input type="text" id="martes" placeholder="Martes">
                    <input type="text" id="miercoles" placeholder="Miércoles">
                </div>
                <div class="grid grid-cols-3 gap-4 mt-4">
                    <input type="text" id="jueves" placeholder="Jueves">
                    <input type="text" id="viernes" placeholder="Viernes">
                    <input type="text" id="sabado" placeholder="Sábado">
                </div>
                <div class="mt-4">
                    <label>Salón</label>
                    <input type="text" id="salon" class="w-full border rounded p-2">
                </div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div>
                        <label>Cupo Máximo</label>
                        <input
                            type="number"
                            id="cupo_maximo"
                            class="w-full border rounded p-2"
                            value="40">
                    </div>
                    <div>
                        <label>Cupos Disponibles</label>
                        <input
                            type="number"
                            id="cupos_disponibles"
                            class="w-full border rounded p-2"
                            value="40">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-azul-uni text-white rounded hover:bg-blue-900">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modalHorario');
        const form = document.getElementById('formHorario');

        // 1. READ
        async function cargarHorarios() {
            try {
                const res = await fetch('/api/horarios');
                const horarios = await res.json();
                const tbody = document.getElementById('tabla-horarios');

                tbody.innerHTML = '';

                horarios.forEach(h => {

                    const horarioTexto = `

                    <div class="flex flex-col gap-1 text-xs">

                        ${h.lunes
                            ? `<span><strong>Lun:</strong> ${h.lunes}</span>`
                            : ''}

                        ${h.martes
                            ? `<span><strong>Mar:</strong> ${h.martes}</span>`
                            : ''}

                        ${h.miercoles
                            ? `<span><strong>Mié:</strong> ${h.miercoles}</span>`
                            : ''}

                        ${h.jueves
                            ? `<span><strong>Jue:</strong> ${h.jueves}</span>`
                            : ''}

                        ${h.viernes
                            ? `<span><strong>Vie:</strong> ${h.viernes}</span>`
                            : ''}

                        ${h.sabado
                            ? `<span><strong>Sáb:</strong> ${h.sabado}</span>`
                            : ''}

                    </div>

                    `;

                    tbody.innerHTML += `
                        <tr class="border-b">
                            <td class="p-3">
                                ${h.id_horario}
                            </td>
                            <td class="p-3">
                                ${h.nombre_materia || h.materia}
                            </td>
                            <td class="p-3">
                                ${h.nombre_profesor || ''}
                                ${h.ap_paterno_profesor || ''}
                            </td>
                            <td class="p-3">
                                ${h.grupo || ''}
                            </td>
                            <td class="p-3">
                                ${h.semestre_turno || ''}
                            </td>
                            <td class="p-3">
                                ${h.salon || ''}
                            </td>
                            <td class="p-3 text-sm">
                                ${horarioTexto}
                            </td>
                            <td class="p-3 whitespace-nowrap">
                                ${h.cupos_disponibles || 0} /
                                ${h.cupo_maximo || 0}
                            </td>
                            <td class="p-3 text-center">

                                <button
                                    onclick="editarHorario(${h.id_horario})"
                                    class="text-blue-500 hover:text-blue-700 mr-2">
                                    <i class="fa-solid fa-pen"></i> 
                                    Editar
                                </button>

                                <button
                                    onclick="borrarHorario(${h.id_horario})"
                                    class="text-red-500 hover:text-red-700">
                                    <i class="fa-solid fa-trash"></i> 
                                    Borrar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }

        // 2. CREATE / UPDATE
        form.addEventListener('submit', async (e) => {

            e.preventDefault();
            const id = document.getElementById('id').value;
            const datos = {

                semestre_turno: document.getElementById('semestre_turno').value,
                cve_materia: document.getElementById('cve_materia').value,
                materia: document.getElementById('materia').value,
                id_profesor: document.getElementById('id_profesor').value,
                id_grupo: document.getElementById('id_grupo').value,
                lunes: document.getElementById('lunes').value,
                martes: document.getElementById('martes').value,
                miercoles: document.getElementById('miercoles').value,
                jueves: document.getElementById('jueves').value,
                viernes: document.getElementById('viernes').value,
                sabado: document.getElementById('sabado').value,
                salon: document.getElementById('salon').value,
                cupo_maximo: document.getElementById('cupo_maximo').value,
                cupos_disponibles: document.getElementById('cupos_disponibles').value

            };

            const modoEdicion = document.getElementById('modoEdicion').value === "true";
            const url = modoEdicion ? `/api/horarios/${id}` : '/api/horarios';
            const metodo = modoEdicion ? 'PUT' : 'POST';
            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });
                if(res.ok) {
                    cerrarModal();
                    cargarHorarios();
                } else {
                    const error = await res.json();
                    alert("Error: " + error.mensaje);
                }
            } catch (error) {
                console.error(error);
                alert('Error al guardar horario');
            }
        });

        // 3. PREPARAR EDICIÓN
        async function editarHorario(id) {

            try {

                const res = await fetch(`/api/horarios/${id}`);
                const h = await res.json();

                document.getElementById('id').value = h.id_horario;
                document.getElementById('semestre_turno').value = h.semestre_turno || '';
                document.getElementById('cve_materia').value = h.cve_materia || '';
                document.getElementById('materia').value = h.materia || '';
                document.getElementById('id_profesor').value = h.id_profesor || '';
                document.getElementById('id_grupo').value = h.id_grupo || '';
                document.getElementById('lunes').value = h.lunes || '';
                document.getElementById('martes').value = h.martes || '';
                document.getElementById('miercoles').value = h.miercoles || '';
                document.getElementById('jueves').value = h.jueves || '';
                document.getElementById('viernes').value = h.viernes || '';
                document.getElementById('sabado').value = h.sabado || '';
                document.getElementById('salon').value = h.salon || '';
                document.getElementById('cupo_maximo').value = h.cupo_maximo || 40;
                document.getElementById('cupos_disponibles').value = h.cupos_disponibles || 40;

                document.getElementById('modoEdicion').value = "true";
                document.getElementById('modalTitulo').innerText = "Editar Horario";

                modal.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert('Error al cargar horario');
            }
        }

        // 4. DELETE
        async function borrarHorario(id) {
            if(confirm('¿Estás seguro de eliminar este registro?')) {
                const res = await fetch(`/api/horarios/${id}`, { method: 'DELETE' });
                if(res.ok) cargarHorarios();
                else {
                    const error = await res.json();
                    alert("Error: " + error.mensaje);
                }
            }
        }

        // CONTROLADORES DE INTERFAZ
        function abrirModal() {
            form.reset();
            document.getElementById('id').readOnly = false;
            document.getElementById('modoEdicion').value = "false";
            document.getElementById('modalTitulo').innerText = "Nuevo Horario";
            modal.classList.remove('hidden');
        }

        function cerrarModal() {
            modal.classList.add('hidden');
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const filas = document.querySelectorAll('.horario-row');
            filas.forEach(fila => {
                const mat = fila.querySelector('.mat-cell').innerText.toLowerCase();
                fila.style.display = mat.includes(query) ? '' : 'none';
            });
        }

        window.addEventListener('DOMContentLoaded', cargarHorarios);
    </script>

    </main>
</body>
</html>
